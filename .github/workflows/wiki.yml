name: Publish documentation Wiki

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-publication
  cancel-in-progress: false

jobs:
  validate:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      qualified: ${{ steps.revision.outputs.qualified }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Match trusted main to the completed validation revision
        id: revision
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          current_sha=$(git rev-parse HEAD)
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            echo 'qualified=true' >> "$GITHUB_OUTPUT"
            echo "sha=$current_sha" >> "$GITHUB_OUTPUT"
          else
            echo 'Validated revision is no longer main; skip publication.'
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.revision.outputs.qualified == 'true'
        with:
          python-version: '3.12'
      - name: Validate public documentation without publication credentials
        if: steps.revision.outputs.qualified == 'true'
        run: |
          python scripts/check_branding.py
          python scripts/check_repository_hygiene.py
          pip install mkdocs==1.6.1
          mkdocs build --strict

  publish:
    needs: validate
    if: needs.validate.outputs.qualified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Require the validated commit to remain current main
        id: freshness
        env:
          REPOSITORY: ${{ github.repository }}
          READ_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)"
          if [ "$(git rev-parse HEAD)" != "$VALIDATED_SHA" ]; then
            echo 'Main advanced after validation; skip publication.'
            exit 0
          fi
          if scripts/wiki_is_current.sh "$VALIDATED_SHA" "https://github.com/$REPOSITORY.git"; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              echo 'Cannot authenticate or retrieve main; publication failed.'
              exit "$result"
            fi
            echo 'A newer main commit exists; skip stale Wiki publication.'
          fi
      - name: Synchronize tracked documentation from a fresh isolated runtime
        if: steps.freshness.outputs.current == 'true'
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          test -n "$WIKI_TOKEN" || { echo 'WIKI_TOKEN is required'; exit 1; }
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)"
          wiki_dir="$RUNNER_TEMP/labgoblin-wiki"
          git clone "https://github.com/$REPOSITORY.wiki.git" "$wiki_dir"
          python -I -S scripts/render_wiki.py "$wiki_dir"
          git -C "$wiki_dir" config user.name github-actions[bot]
          git -C "$wiki_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$wiki_dir" add --all
          if ! git -C "$wiki_dir" diff --cached --quiet; then
            git -C "$wiki_dir" commit -m "Publish LabGoblin documentation from $(git rev-parse HEAD)"
            if scripts/wiki_is_current.sh "$(git rev-parse HEAD)" "https://github.com/$REPOSITORY.git"; then
              git -C "$wiki_dir" push origin HEAD
            else
              result=$?
              if [ "$result" -ne 1 ]; then
                echo 'Cannot authenticate or retrieve main; publication failed.'
                exit "$result"
              fi
              echo 'Main advanced during rendering; skip stale Wiki publication.'
            fi
          fi
