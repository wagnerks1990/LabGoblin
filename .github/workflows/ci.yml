name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/rebuild-v2-*'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: labgoblin_test
          POSTGRES_USER: labgoblin
          POSTGRES_PASSWORD: test-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labgoblin -d labgoblin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://labgoblin:test-${{ github.run_id }}@127.0.0.1:5432/labgoblin_test
      JWT_SECRET_KEY: ${{ github.sha }}${{ github.sha }}
      CONFIG_ENCRYPTION_KEY: ${{ github.sha }}${{ github.sha }}
      PROXMOX_BASE_URL: https://127.0.0.1:8006/api2/json
      PROXMOX_TOKEN_ID: ci@pve!labgoblin
      PROXMOX_TOKEN_SECRET: ${{ github.sha }}
      PROXMOX_VERIFY_SSL: 'true'
      WORKER_SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: npm ci --prefix frontend
      - run: python -m compileall -q backend/app backend/tests deploy/provision_cloudflare.py
      - run: ruff format --check backend/app backend/tests deploy scripts tests
      - run: ruff check backend/app backend/tests deploy scripts tests
      - run: bandit -r backend/app deploy -ll -q
      - run: pip-audit -r backend/requirements.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - name: Verify deployed schema is at every repository head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine
          from app.core.config import settings

          config = Config("backend/alembic.ini")
          config.set_main_option("script_location", "backend/alembic")
          expected = set(ScriptDirectory.from_config(config).get_heads())
          with create_engine(settings.database_url).connect() as connection:
              current = set(MigrationContext.configure(connection).get_current_heads())
          if current != expected:
              raise SystemExit(f"database heads {sorted(current)} != repository heads {sorted(expected)}")
          print(f"database schema current at {sorted(current)}")
          PY
      - run: alembic -c backend/alembic.ini check
      - name: Import every runtime Python module
        run: pytest -q backend/tests/test_all_runtime_modules_import.py
      - run: pytest -q --disable-warnings backend/tests
      - name: Verify generated OpenAPI contract
        run: |
          python scripts/export_openapi.py frontend/openapi.json
          npm --prefix frontend run generate:api
          git diff --exit-code -- frontend/openapi.json frontend/src/generated/api-schema.d.ts

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs==1.6.1
      - run: mkdocs build --strict

  frontend-container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t labgoblin-web:audit frontend
      - name: Prefetch vulnerability database without repository access
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-trivy-cache"
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$RUNNER_TEMP/frontend-trivy-cache:/cache" \
            aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            image --cache-dir /cache --db-repository registry-1.docker.io/aquasec/trivy-db:2 --download-db-only
      - name: Scan exported frontend runtime without network or daemon access
        run: |
          mkdir -p container-audit "$RUNNER_TEMP/frontend-container-scan"
          docker save --output "$RUNNER_TEMP/frontend-image.tar" labgoblin-web:audit
          docker run --rm --user "$(id -u):$(id -g)" --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m --tmpfs /cache:rw,nosuid,nodev,size=2g \
            -v "$RUNNER_TEMP/frontend-trivy-cache/db:/database:ro" \
            -v "$RUNNER_TEMP/frontend-image.tar:/candidate.tar:ro" \
            -v "$RUNNER_TEMP/frontend-container-scan:/reports" \
            --entrypoint sh \
            aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            -eu -c 'mkdir -p /cache/db; cp /database/* /cache/db/; exec trivy image --cache-dir /cache --skip-db-update --skip-java-db-update --offline-scan --input /candidate.tar --scanners vuln,secret --format json --output /reports/frontend.json'
      - name: Reject fixable advisories and secrets without hiding remaining findings
        run: |
          python - <<'PY'
          import collections
          import json
          import os

          report = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "frontend-container-scan", "frontend.json")))
          # Preserve complete advisory data and secret locations without publishing matches.
          allowed_secret_fields = {"RuleID", "Category", "Severity", "Title", "StartLine", "EndLine", "Layer"}
          for result in report.get("Results", []):
              if "Secrets" in result:
                  result["Secrets"] = [{key: value for key, value in secret.items() if key in allowed_secret_fields} for secret in result["Secrets"]]
          with open("container-audit/frontend.json", "w") as output:
              json.dump(report, output)
          vulnerabilities = [v for result in report.get("Results", []) for v in result.get("Vulnerabilities", [])]
          secrets = [s for result in report.get("Results", []) for s in result.get("Secrets", [])]
          fixable = [v for v in vulnerabilities if v.get("FixedVersion")]
          print("All advisory records:", len(vulnerabilities), dict(collections.Counter(v["Severity"] for v in vulnerabilities)))
          print("Fixable advisory records:", len(fixable), "Secret findings:", len(secrets))
          for vulnerability in vulnerabilities:
              print(vulnerability["PkgName"], vulnerability["VulnerabilityID"], vulnerability["Severity"], vulnerability.get("FixedVersion", "no recorded fix"))
          if fixable or secrets:
              raise SystemExit("Container security qualification failed; review retained JSON report")
          PY
      - name: Preserve complete runtime security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-container-security-${{ github.sha }}
          path: container-audit/frontend.json
          if-no-files-found: error
          retention-days: 14

  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_branding.py
      - run: python scripts/check_repository_hygiene.py
      - run: sh -n deploy/install.sh deploy/configure-cloudflare.sh backend/docker-entrypoint.sh scripts/generate_api_contract.sh
      - run: bash -n scripts/codex_cloud_check.sh scripts/deploy.sh scripts/backend-restart.sh scripts/frontend-build.sh

  disposable-live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: test-${{ github.run_id }}
      JWT_SECRET_KEY: ${{ github.sha }}${{ github.sha }}
      CONFIG_ENCRYPTION_KEY: ${{ github.sha }}${{ github.sha }}
      UPDATER_TOKEN: ${{ github.sha }}
      BOOTSTRAP_ADMIN_TOKEN: ${{ github.run_id }}-${{ github.sha }}
      UPDATER_GID: '0'
      HTTP_PORT: '8080'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python -m compileall -q deploy/updater_agent.py deploy/provision_cloudflare.py
      - run: sh -n deploy/install.sh deploy/configure-cloudflare.sh backend/docker-entrypoint.sh
      - run: docker compose -f docker-compose.yml -f docker-compose.live-test.yml config --quiet
      - run: sudo mkdir -p /run/labgoblin-updater
      - run: docker compose -f docker-compose.yml -f docker-compose.live-test.yml up -d --build
      - name: Verify patched frontend runtime libraries
        run: |
          docker compose -f docker-compose.yml -f docker-compose.live-test.yml exec -T web sh -eu -c '
            for requirement in libexpat:2.8.5-r0 libpng:1.6.59-r0 nghttp2-libs:1.70.0-r0 pcre2:10.49-r0 tiff:4.7.2-r0 zlib:1.3.2-r1; do
              package=${requirement%%:*}
              minimum=${requirement#*:}
              installed=$(apk list --from installed --manifest "$package" | sed "s/^$package //")
              test -n "$installed"
              test "$(apk version --no-network -t "$installed" "$minimum")" != "<"
            done
          '
      - name: Verify bundled Guacamole protocol support
        run: docker compose -f docker-compose.yml -f docker-compose.live-test.yml exec -T api python < backend/scripts/check_guacd.py
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if [ "$(curl -fsS http://127.0.0.1:8080/api/ready | python -c 'import json,sys; print(str(json.load(sys.stdin).get("ready") is True).lower())' 2>/dev/null)" = true ]; then
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.live-test.yml ps
          docker compose -f docker-compose.yml -f docker-compose.live-test.yml logs --no-color
          exit 1
      - name: Verify public branding asset is readable
        run: curl --fail --silent --show-error http://127.0.0.1:8080/brand/labgoblin-icon.svg -o /dev/null
      - name: Run destructive disposable live test
        run: >-
          python scripts/live_test.py
          --base-url http://127.0.0.1:8080
          --bootstrap-token "$BOOTSTRAP_ADMIN_TOKEN"
          --i-understand-this-deletes-data
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.live-test.yml down --volumes --remove-orphans
