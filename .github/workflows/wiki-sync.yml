name: Wiki synchronization
on:
  push:
    branches: [main]
    paths: ['docs/maintenance/wiki-home.md', '.github/workflows/wiki-sync.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wiki-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish approved landing page
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKI_TOKEN" || { echo 'WIKI_TOKEN is required'; exit 1; }
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS="$RUNNER_TEMP/wiki-askpass"
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$WIKI_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"
          trap 'rm -f "$GIT_ASKPASS"; rm -rf "$RUNNER_TEMP/wiki" "$RUNNER_TEMP/wiki-verify"' EXIT
          git -c credential.helper= clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cp docs/maintenance/wiki-home.md "$RUNNER_TEMP/wiki/Home.md"
          cd "$RUNNER_TEMP/wiki"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Home.md
          if git diff --cached --quiet; then
            git -c credential.helper= push --dry-run origin HEAD
          else
            git commit -m "Synchronize approved LabGoblin Wiki home (${GITHUB_SHA})"
            git -c credential.helper= push origin HEAD
          fi
          git -c credential.helper= clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki-verify"
          cmp Home.md "$RUNNER_TEMP/wiki-verify/Home.md"
