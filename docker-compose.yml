name: labgoblin

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labgoblin}
      POSTGRES_USER: ${POSTGRES_USER:-labgoblin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    networks:
      - console-private
      - console-egress
    environment:
      GUACD_LOG_LEVEL: warning
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "nc -z 127.0.0.1 4822"]
      interval: 10s
      timeout: 3s
      retries: 10
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

  api:
    build: ./backend
    networks:
      - default
      - console-private
    restart: unless-stopped
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-labgoblin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-labgoblin}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY is required}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      BROWSER_TRUSTED_ORIGINS: ${BROWSER_TRUSTED_ORIGINS:-}
      CLOUDFLARE_TUNNEL_ENABLED: ${CLOUDFLARE_TUNNEL_ENABLED:-false}
      CLOUDFLARE_PUBLIC_HOSTNAME: ${CLOUDFLARE_PUBLIC_HOSTNAME:-}
      CLOUDFLARE_ACCESS_REQUIRED: ${CLOUDFLARE_ACCESS_REQUIRED:-false}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUDIENCE: ${CLOUDFLARE_ACCESS_AUDIENCE:-}
      CLOUDFLARE_ACCESS_JWKS_TTL_SECONDS: ${CLOUDFLARE_ACCESS_JWKS_TTL_SECONDS:-3600}
      PROXMOX_BASE_URL: ${PROXMOX_BASE_URL:-https://127.0.0.1:8006/api2/json}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-bootstrap@pve!replace}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-replace-in-gui}
      PROXMOX_VERIFY_SSL: ${PROXMOX_VERIFY_SSL:-true}
      PROXMOX_ALLOW_INSECURE_TLS: ${PROXMOX_ALLOW_INSECURE_TLS:-false}
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      GUACD_BRIDGE_HOST: api
      GUACAMOLE_ALLOWED_NETWORKS: ${GUACAMOLE_ALLOWED_NETWORKS:-}
      SSH_TERMINAL_ENABLED: ${SSH_TERMINAL_ENABLED:-false}
      UPDATER_TOKEN: ${UPDATER_TOKEN:?UPDATER_TOKEN is required}
      UPDATER_REPOSITORY: ${UPDATER_REPOSITORY:-https://github.com/wagnerks1990/labgoblin.git}
      UPDATER_ALLOW_AUTOMATIC: ${UPDATER_ALLOW_AUTOMATIC:-false}
      UPDATER_REQUIRE_SIGNED_COMMITS: ${UPDATER_REQUIRE_SIGNED_COMMITS:-false}
      REDIS_URL: redis://redis:6379/0
      REPLAY_STORE_BACKEND: redis
      WORKER_LOCK_BACKEND: redis
      WORKER_SCHEDULER_ENABLED: "true"
      RUN_MIGRATIONS: "true"
    volumes:
      - /var/lib/labgoblin/updater:/var/lib/labgoblin/updater
    group_add:
      - "${UPDATER_GID:?UPDATER_GID is required}"
    depends_on:
      guacd:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    networks:
      - default
      - cloudflare-edge
    depends_on:
      - api

  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:20241
      - run
      - --token-file
      - /run/secrets/cloudflare-tunnel-token
    volumes:
      - type: bind
        source: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-/etc/labgoblin/cloudflare-tunnel-token}
        target: /run/secrets/cloudflare-tunnel-token
        read_only: true
    group_add:
      - "${CLOUDFLARE_TUNNEL_GID:-65534}"
    networks:
      - cloudflare-edge
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

volumes:
  postgres-data:
  redis-data:

networks:
  console-private:
    internal: true
  console-egress:
  cloudflare-edge:
